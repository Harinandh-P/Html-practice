<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Color Boxes</title>

    <style>
        body {
            margin: 0;
            padding: 100px;
            font-family: Arial, sans-serif;
            background-color: white;
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            /* White space between boxes */
        }
        
        .box {
            width: 100000px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            color: white;
            border-radius: 50px;
        }
        
        .box1 {
            background-color: #e73cbfff;
        }
        
        .box2 {
            background-color: #db34b4be;
        }
        
        .box3 {
            background-color: #cc2ea28e;
        }
        
        .box4 {
            background-color: #f10fc465;
        }
        
        .box5 {
            background-color: #b659aa74;
        }
        
        .box6 {
            background-color: #e6229e52;
        }
        
        .box7 {
            background-color: #bc1ab12d;
        }
        
        .box8 {
            background-color: #09e6e6;
        }
        
        .box9 {
            background-color: #e84343;
        }
        
        .box10 {
            background-color: #16a085;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
        <div class="box box6">6</div>
        <div class="box box7">7</div>
        <div class="box box8">8</div>
        <div class="box box9">9</div>
        <div class="box box10">10</div>

    </div>

</body>

</html>
